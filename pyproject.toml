[project]
name = "UV-HTML-DEMO"
version = "0.1.0"
description = "FastAPI sample app serving HTML content managed with uv"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/html_demo"]

[[tool.uv.index]]
name = "py-uv-virtual"
url = "https://psazuse.jfrog.io/artifactory/api/pypi/py-uv-virtual/simple"

[[index]]
name="py-uv-virtual"
publish-url = "https://psazuse.jfrog.io/artifactory/api/pypi/py-uv-virtual"
url = "https://psazuse.jfrog.io/artifactory/api/pypi/py-uv-virtual/simple"
default = true